<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather App</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="card">
    <h2>Weather App</h2>
    
    <div class="search">
      <input type="text" id="cityInput" placeholder="শহরের নাম লিখুন (যেমন: Dhaka)">
      <button onclick="getWeather()">সার্চ</button>
    </div>

    <!-- Loading Spinner -->
    <div id="loader" class="loader" style="display: none;"></div>

    <!-- Error Message Display -->
    <p id="errorMessage" class="error-msg" style="display: none;"></p>

    <!-- Weather Information Display -->
    <div class="weather-info" id="weatherInfo">
      <h3 id="cityName">---</h3>
      <div id="weatherIconContainer">
        <i id="weatherIcon" class="fa-solid fa-sun"></i>
      </div>
      <p id="temperature">-- °C</p>
      <p id="windSpeed">Wind Speed: -- km/h</p>
    </div>
    <code>Full-Stake Developer | Software Developer - Md.Shovon <br></code>
  </div>

  <script src="script.js"></script>
</body>
</html>
